<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="师兄师姐帮帮我">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>师兄师姐帮帮我</title>
<style>
body{margin:0;background:#f4f7fb;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loading-card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:22px;max-width:420px;box-shadow:0 8px 28px rgba(15,23,42,.06)}.loading-card b{display:block;font-size:20px;margin-bottom:8px}.loading-card span{color:#64748b;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="loading"><div class="loading-card"><b>师兄师姐帮帮我 v1.5</b><span>正在加载实验工具与本地库存数据…</span></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('./legacy-v1.3.html',{cache:'no-store'});
    if(!r.ok)throw new Error('legacy '+r.status);
    let html=await r.text();
    html=html.replace('<span class="small">v1.3</span>','<span class="small">v1.5</span>');
    html=html.replace('</body>','<script src="./patch-v1.5.js"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><div class="loading-card"><b>加载失败</b><span>请联网后刷新页面。你的本地库存数据不会因此被删除。</span></div></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
