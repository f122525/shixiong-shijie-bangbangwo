<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>师兄师姐帮帮我 · 强制更新</title>
<style>
body{margin:0;background:#f4f7fb;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:22px;box-sizing:border-box}.title{font-size:21px;font-weight:800;margin-bottom:8px}.msg{font-size:14px;line-height:1.7;color:#475569}.ok{color:#047857}.bad{color:#b91c1c}.small{font-size:12px;color:#64748b;margin-top:10px}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="title">正在更新到 v1.5</div><div id="msg" class="msg">正在清理旧网页缓存。不会删除库存、细胞库或历史记录。</div><div class="small">这里只删除 Service Worker 和 Cache Storage，不会调用 localStorage.clear()。</div></div></div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('labcalc-')).map(k=>caches.delete(k)));
    }
    msg.className='msg ok';
    msg.textContent='旧缓存已清理，正在重新打开最新版…';
    setTimeout(()=>location.replace('./index.html?v=1.5.1&ts='+Date.now()),500);
  }catch(e){
    msg.className='msg bad';
    msg.textContent='自动清理失败。请关闭主屏幕 App 后，再重新打开本页重试。';
    console.error(e);
  }
})();
</script>
</body>
</html>
